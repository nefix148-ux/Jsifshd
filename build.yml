name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - name: Create project
        run: |
          set -e
          test -f index.html || { echo "Upload index.html to the repo root"; exit 1; }
          mkdir -p app/src/main/assets app/src/main/java/com/ruslo3d/game app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          cat > app/build.gradle <<'EOF_0'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ruslo3d.game'
            compileSdk 34
            defaultConfig { applicationId 'com.ruslo3d.game'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF_0
          cat > app/src/main/AndroidManifest.xml <<'EOF_1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="РУСЛО 3D" android:icon="@drawable/ic_launcher" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true"
                android:screenOrientation="sensorLandscape"
                android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF_1
          cat > app/src/main/assets/landscape.css <<'EOF_2'
          #btnPanel,#tabs,#rotVeil{display:none}
          #rotVeil{position:fixed;inset:0;z-index:300;background:#04101cf5;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;font:700 14px Manrope,system-ui,sans-serif;color:#eaf6f8}
          #rotVeil svg{width:54px;height:54px;color:var(--cyan);animation:rotp 2.4s ease-in-out infinite}
          @keyframes rotp{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
          @media (orientation:portrait) and (max-width:700px){body:not(.noRot) #rotVeil{display:flex}}
          @media (orientation:landscape) and (max-height:540px),(orientation:landscape) and (pointer:coarse){
          :root{--topH:40px}
          html,body{overflow:hidden}#app{height:100dvh}
          #topbar{padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));gap:5px}
          .logo h1,.logo small{display:none}.logo .mark{width:28px;height:28px}
          .seg button span{display:none}.seg button{padding:5px 9px}
          .ibtn{width:30px;height:30px}#btnPanel{display:grid;color:var(--cyan);border-color:var(--line2)}
          main{display:flex;padding:0;gap:0}
          #stageCol{flex:1;gap:0}
          #frame{border-radius:0;border-width:1px 0 0}
          #statsbar,#legend,#mcDesc{display:none}
          #hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:30;max-width:60%;font-size:10px;padding:5px 26px 5px 9px}
          #chips{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
          #minimapWrap{left:auto;right:8px;top:46px;bottom:auto}#minimap{width:96px;height:60px}
          #missionCard{width:min(220px,34%);top:6px;left:62px;max-height:52%}
          #panel{position:fixed;top:var(--topH);right:0;bottom:0;width:min(450px,64vw);z-index:70;display:block;padding:0 0 8px;border-radius:12px 0 0 12px;transform:translateX(105%);transition:transform .22s ease;background:#0a1a29fa;box-shadow:-12px 0 40px -12px #000}
          body.pOpen #panel{transform:none}
          #tabs{display:flex;position:sticky;top:0;z-index:3;gap:4px;padding:6px 8px;background:#0a1a29;border-bottom:1px solid var(--line)}
          #tabs button{flex:1;border:1px solid var(--line);background:#0b1e30;color:var(--muted);font:800 10.5px Manrope,sans-serif;border-radius:8px;padding:8px 2px;cursor:pointer}
          #tabs button.on{background:var(--gw);color:#04222e;border-color:transparent}
          #tabs button.x{flex:none;width:34px;padding:0;font-size:13px}
          #panel .pg{display:none;padding:8px 10px}#panel .pg.act{display:block}
          .grid2{grid-template-columns:repeat(3,1fr)}
          .tools{grid-template-columns:repeat(8,1fr)}.tool{height:46px}
          #toasts{left:50%;transform:translateX(-50%);top:calc(var(--topH) + 6px);bottom:auto;align-items:center}
          .card{padding:12px 14px}#endStars{margin:6px 0 2px}#endStars svg{width:28px;height:28px}#endStats{margin:4px 0 8px}
          #missionsGrid{grid-template-columns:repeat(5,minmax(0,1fr))}.mcard .md{font-size:9px;min-height:0}
          }
          EOF_2
          cat > app/src/main/assets/landscape.js <<'EOF_3'
          (function(){
          const panel=document.getElementById('panel'),secs=[...panel.querySelectorAll('.pg')];
          const G=[['Инструменты',[0,5]],['Поток',[1]],['Камера',[2,4]],['Мир',[3]]];
          const bar=document.createElement('div');bar.id='tabs';
          const show=i=>{G.forEach((g,k)=>g[1].forEach(j=>secs[j].classList.toggle('act',k===i)));
           [...bar.children].forEach((b,k)=>b.classList.toggle('on',k===i));panel.scrollTop=0;};
          const setP=v=>{document.body.classList.toggle('pOpen',v);if(v){try{exitLock();resetInput();}catch(e){}}};
          G.forEach((g,i)=>{const b=document.createElement('button');b.textContent=g[0];b.onclick=()=>show(i);bar.appendChild(b);});
          const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=()=>setP(false);bar.appendChild(x);
          panel.prepend(bar);show(0);
          const tb=document.createElement('button');tb.className='ibtn';tb.id='btnPanel';tb.title='Настройки';
          tb.innerHTML='<svg><use href="#i-sliders"/></svg>';
          tb.onclick=()=>setP(!document.body.classList.contains('pOpen'));
          const help=document.getElementById('btnHelp');help.parentNode.insertBefore(tb,help);
          const rv=document.createElement('div');rv.id='rotVeil';
          rv.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg><div>Поверни телефон горизонтально</div><button class="btn ghost" id="rotGo">Играть на весь экран</button>';
          document.body.appendChild(rv);
          document.getElementById('rotGo').onclick=()=>{document.body.classList.add('noRot');
           try{const r=document.documentElement.requestFullscreen();r&&r.then(()=>screen.orientation.lock('landscape')).catch(()=>{});}catch(e){}};
          addEventListener('keydown',e=>{if(e.key==='Escape')setP(false);});
          })();
          EOF_3
          cat > app/src/main/java/com/ruslo3d/game/MainActivity.java <<'EOF_4'
          package com.ruslo3d.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.*;
          import java.io.*;

          public class MainActivity extends Activity {
            static final String HOST = "https://appassets.androidplatform.net";
            WebView web;

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              web = new WebView(this);
              web.setBackgroundColor(0xFF04101A);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient() {
                @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  if (!r.getUrl().toString().startsWith(HOST)) return null;
                  try {
                    if (!"/index.html".equals(r.getUrl().getPath())) throw new IOException("404");
                    String html = new String(read("index.html"), "UTF-8");
                    html = html.replace("</style>", new String(read("landscape.css"), "UTF-8") + "</style>")
                               .replace("</body>", "<script>" + new String(read("landscape.js"), "UTF-8") + "</script></body>");
                    return new WebResourceResponse("text/html", "UTF-8", new ByteArrayInputStream(html.getBytes("UTF-8")));
                  } catch (Exception e) {
                    return new WebResourceResponse("text/plain", "UTF-8", 404, "Not Found", null, new ByteArrayInputStream(new byte[0]));
                  }
                }
              });
              web.loadUrl(HOST + "/index.html");
            }

            byte[] read(String name) throws IOException {
              InputStream in = getAssets().open(name);
              ByteArrayOutputStream out = new ByteArrayOutputStream();
              byte[] buf = new byte[16384];
              int n;
              while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
              in.close();
              return out.toByteArray();
            }

            void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) immersive(); }
            @Override protected void onResume() { super.onResume(); web.onResume(); immersive(); }
            @Override protected void onPause() { super.onPause(); web.onPause(); }
            @Override public void onBackPressed() { moveTaskToBack(true); }
          }
          EOF_4
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_5'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="#071a2b" android:pathData="M0,0h64v64h-64z"/>
            <path android:fillColor="#2dd4ee" android:pathData="M32,10c8,12 16,20 16,30a16,16 0,1 1,-32 0c0,-10 8,-18 16,-30z"/>
          </vector>
          EOF_5
          cat > build.gradle <<'EOF_6'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_6
          cat > gradle.properties <<'EOF_7'
          org.gradle.jvmargs=-Xmx2g
          EOF_7
          cat > settings.gradle <<'EOF_8'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Ruslo3D'
          include ':app'
          EOF_8
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: ruslo3d-apk, path: app/build/outputs/apk/debug/app-debug.apk}
